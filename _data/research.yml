papers:
  restricting-video-games-china:
    title: "Restricting Video Games in China"
    full_title: "Restricting video games in China: Effects on time use, educational achievement, and health"
    authors: Zhejian Wang
    status: Peer-reviewed publication
    journal: Journal of Development Economics
    volume: "182"
    article: "103812"
    year: 2026
    doi: https://doi.org/10.1016/j.jdeveco.2026.103812
    details_url: /research/restricting-video-games-china/
    question: >-
      How did China's strict limits on minors' online gaming affect digital
      behavior, education, and health?
    evidence: >-
      Nationally representative survey data and city-level administrative data;
      difference-in-differences and regression kink designs.
    abstract: >-
      In 2021, the Chinese government introduced a highly restrictive policy
      that sharply limited minors' access to online video games, effectively
      eliminating weekday play and allowing only minimal play on weekends and
      holidays. Using nationally representative survey data and a
      difference-in-differences design, I find that the policy sharply reduced
      minors' gaming engagement and overall Internet use, reflecting
      substantial but incomplete compliance. However, these behavioral changes
      did not produce detectable short-run improvements in academic performance,
      nor clear evidence of an increase in study time. The health-related
      evidence is more limited, with no clear physical-health gains and
      suggestive indications of reduced mental well-being. Complementary
      evidence from city-level administrative data and a regression kink design
      likewise shows no robust effects on exam outcomes.
    citation_text: >-
      Wang, Z. (2026). Restricting video games in China: Effects on time use,
      educational achievement, and health. Journal of Development Economics,
      182, 103812. https://doi.org/10.1016/j.jdeveco.2026.103812
    repec: https://ideas.repec.org/a/eee/deveco/v182y2026ics0304387826000957.html
    publisher: Elsevier (North-Holland)
    bibtex: |-
      @article{Wang2026Restricting,
        title = {Restricting video games in China: Effects on time use, educational achievement, and health},
        author = {Wang, Zhejian},
        journal = {Journal of Development Economics},
        volume = {182},
        pages = {103812},
        year = {2026},
        doi = {10.1016/j.jdeveco.2026.103812},
        publisher = {Elsevier}
      }

