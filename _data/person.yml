about_paragraphs:
- I am a Postdoctoral Fellow at the National School of Development, Peking University. I received my Ph.D.
  in Economics from the University of Delaware in August 2026.
- My research is in applied microeconomics. I study how digital regulation, education policy, and household
  institutions shape human capital and behavior, primarily in China.
developing_direction: At Peking University, I am developing research on digital technologies and education, including how
  artificial intelligence may affect learning and educational opportunity.
