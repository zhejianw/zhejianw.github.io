# ============================================
# Zhejian Wang - Personal Academic Website
# Based on academicpages template
# ============================================

locale: "en-US"
site_theme: "default"
title: "Zhejian Wang - Applied Microeconomist"
title_separator: "-"
name: &name "Zhejian Wang"
description: &description "Applied microeconomist studying digital regulation, education policy, and household institutions"
url: "https://zhejianwang.com"
baseurl: ""
repository: "zhejianw/zhejianw.github.io"
og_image: "social/zhejian-wang-social-card.jpg"
og_description: "Zhejian Wang is an applied microeconomist studying digital regulation, education policy, and household institutions."

author:
  avatar: "portrait/zhejian-wang-480.jpg"
  name: "Zhejian Wang"
  pronouns: "he/him"
  bio: "Ph.D. Candidate in Economics, University of Delaware. Applied microeconomist studying digital regulation, education policy, and household institutions."
  location: "Newark, Delaware, USA"
  employer: "University of Delaware"
  email: "zhejianw@udel.edu"
  github: "zhejianw"
  googlescholar: "https://scholar.google.com/citations?user=fQDiJ1QAAAAJ"
  orcid: "https://orcid.org/0009-0001-0016-0421"

publication_category:
  workingpapers:
    title: 'Working Papers'
  manuscripts:
    title: 'Publications'
  conferences:
    title: 'Conference Presentations'

teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false

atom_feed:
  hide: false

social:
  type: "Person"
  name: "Zhejian Wang"
  links:
    - "https://scholar.google.com/citations?user=fQDiJ1QAAAAJ"
    - "https://www.linkedin.com/in/zhejianwang"
    - "https://github.com/zhejianw"
    - "https://orcid.org/0009-0001-0016-0421"

analytics:
  provider: "google-analytics-4"
  google:
    tracking_id: "G-JZNLZZP783"

include:
  - .htaccess
  - .well-known
  - _pages
  - files
  - images
  - ai
exclude:
  - AI_CONTEXT.md
  - CONTENT_LICENSE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - Zhejian_CV.pdf
  - images/19.jpg
  - ai/README.md
  - ai/context.md
  - files/JMP.pdf
  - files/bibtex1.bib
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap_out.ipynb
  - talkmap.py
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - LICENSE
  - README
  - node_modules
  - tmp
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: "ai/prompts"
    values:
      prompt_collapse: true
      noindex: true
      sitemap: false
      visibility: unlisted-public
  - scope:
      path: "classic"
    values:
      layout: classic-single
      version: classic
      noindex: true
      sitemap: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
