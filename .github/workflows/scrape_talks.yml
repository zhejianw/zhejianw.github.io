name: Validate Talk Map (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Reproduce talk map
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check jupyter pandas requests beautifulsoup4 geopy getorg

      - name: Reproduce notebook
        run: jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

      - name: Require manual review of generated changes
        run: |
          if ! git diff --quiet -- talkmap_out.ipynb; then
            echo "::error::talkmap_out.ipynb is not reproducible from the committed inputs. Regenerate it locally, review it, and commit it manually."
            git diff --stat -- talkmap_out.ipynb
            exit 1
          fi
