research_statement: I study how digital regulation, education policy, and household institutions shape
  human capital and behavior. My work uses policy variation and large-scale microdata, with a primary
  focus on China.
short_bio: Zhejian Wang is a Postdoctoral Fellow at the National School of Development, Peking University.
  His research in applied microeconomics examines digital regulation, education and human capital,
  and household economics.
